      '/all-design-course.html': '/ui-ux-courses-chennai/best-ui-ux-courses-in-chennai.html',
      '/design-courses-in-chennai.html': '/ui-ux-courses-chennai/best-ui-ux-courses-in-chennai.html'
    };
    const target = redirects[window.location.pathname.toLowerCase()];
    if (target && target !== window.location.pathname) {
      window.location.replace(target);
      return;
    }
  })();

  (() => {
    const stage = document.querySelector('[data-error-stage]');
    if (!stage || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const pieces = [...stage.querySelectorAll('[data-depth]')];
    let frame = 0;
    const move = (event) => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const rect = stage.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width - .5) * 2;
        const y = ((event.clientY - rect.top) / rect.height - .5) * 2;
        pieces.forEach((piece) => {
          const depth = Number(piece.dataset.depth || 0);
          piece.style.setProperty('--parallax-x', x * depth * 14 + 'px');
          piece.style.setProperty('--parallax-y', y * depth * 10 + 'px');
        });
      });
    };
    const reset = () => pieces.forEach((piece) => {
      piece.style.setProperty('--parallax-x', '0px');
      piece.style.setProperty('--parallax-y', '0px');
    });
    stage.addEventListener('pointermove', move);
    stage.addEventListener('pointerleave', reset);
  })();
</script>
